<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Session Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=3.0.0">
</head>
<body class="login-wrapper">

    <div class="login-card flex-col items-center">
        <div class="login-logo mb-4">SM</div>
        <h1 class="text-2xl font-bold text-center mb-1">Session Manager</h1>
        <p class="text-sm text-muted text-center mb-6">Secure Access Provisioning</p>

        {% if error %}
        <div class="flex items-center gap-2 p-4 mb-6 rounded-sm border bg-glass text-danger font-medium w-full" style="background: rgba(255, 90, 95, 0.05); border-color: rgba(255, 90, 95, 0.2);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            <span class="text-sm">{{ error }}</span>
        </div>
        {% endif %}

        <form method="post" action="/login" id="loginForm" class="w-full">
            <div class="form-group mb-4">
                <label for="token" class="form-label text-sm text-muted mb-2 block">Authentication Token</label>
                <input
                    type="password"
                    id="token"
                    name="token"
                    class="form-input w-full"
                    placeholder="Paste secure token..."
                    autocomplete="off"
                    autofocus
                    required
                >
            </div>
            <button type="submit" class="btn btn-primary btn-md w-full mt-2" id="loginBtn">
                Authenticate Session
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
        </form>

        <div class="mt-6 pt-4 border-t w-full text-center">
            <p class="text-xs text-muted">Tokens are single-use and expire in 10 minutes.</p>
        </div>
    </div>

    <!--
        No inline script here. The previous version read the token from
        window.location.search and auto-submitted it, which required the token
        to be in the URL. Tokens are now pasted and travel in the POST body
        only, so no client-side script is needed at all — which also lets the
        CSP drop 'unsafe-inline' from script-src.
    -->
</body>
</html>
